[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openwakeword"
version = "0.7.0"
authors = [
  { name="David Scripka", email="david.scripka@gmail.com" },
]
description = "An open-source audio wake word (or phrase) detection framework with a focus on performance and simplicity"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.21",
    "onnxruntime>=1.16,<2",
    "ai-edge-litert>=1.2,<3",
    "tqdm>=4.0,<5.0",
    "scipy>=1.7,<2",
    "scikit-learn>=1,<2",
    "requests>=2.0,<3",
]

[project.optional-dependencies]
# Optional Speex noise suppression (Linux only, needs libspeexdsp-dev to build on Python >= 3.13)
speex = [
    'speexdsp-ns>=0.1.2,<1; platform_system == "Linux"',
]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "flake8>=7,<8",
    "pytest-mypy>=0.10",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
    "mock>=5.1,<6",
    "types-mock>=5.1,<6",
]
# Dependencies for training custom models with openwakeword.train
train = [
    "torch>=2.1,<3",
    "torchinfo>=1.8.0,<2",
    "torchmetrics>=1.0,<2",
    "audiomentations>=0.30.0,<1",
    "torch-audiomentations>=0.11.0,<1",
    "soundfile>=0.12",
    "mutagen>=1.46.0,<2",
    "pyyaml>=6.0,<7",
    "pronouncing>=0.2.0,<1",
    "deep-phonemizer>=0.0.19,<0.1",
    "onnx>=1.14",
]
# Conversion of trained models to tflite (LiteRT)
tflite = [
    "litert-torch>=0.5",
]
# Everything needed for training and tests (kept for backwards compatibility)
full = [
    "openwakeword[train,test,speex]",
    "datasets>=2.14.4",
]

[project.urls]
"Homepage" = "https://github.com/dscripka/openWakeWord"
"Bug Tracker" = "https://github.com/dscripka/openWakeWord/issues"

[tool.setuptools.packages.find]
include = ["openwakeword*"]

[tool.pytest.ini_options]
addopts = "--cov=openwakeword --cov-report term-missing --mypy"
testpaths = [
    "tests",
    "openwakeword"
]

[tool.mypy]
ignore_missing_imports = true
